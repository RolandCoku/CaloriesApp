<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Register</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
<div class="container">
    <div class="register-box">
        <div class="logo">
            <img src="/images/logo.png" alt="Calorie Tracker Logo"/>
        </div>
        <h1>Create Your Account</h1>
        <p class="subtitle">Join us and start tracking your calories today!</p>
        <form id="registerForm" th:action="@{/users}" method="post">
            <div class="form-group">
                <label for="name">First Name:</label>
                <input type="text" id="name" name="firstName" required placeholder="Enter your first name">
            </div>
            <div class="form-group">
                <label for="surname">Last Name:</label>
                <input type="text" id="surname" name="lastName" required placeholder="Enter your last name">
            </div>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Create a password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="Confirm your password">
            </div>
            <div id="error-message" class="error-message"></div> <!-- Error message container -->
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="footer">
            <p>Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault(); // Prevent default form submission

        // Create a JSON object from form data
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        const response = await fetch(this.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            // Redirect on success
            window.location.href = '/login'; // Redirect to log in
        } else {
            // Display error messages
            const errorMessage = await response.text();
            document.getElementById('error-message').innerText = errorMessage || 'Registration failed. Please check your inputs.';
        }
    });
</script>
</body>
</html>
